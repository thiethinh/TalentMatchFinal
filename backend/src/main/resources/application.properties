spring.application.name=TalentMatch
server.port=8080

# Import cấu hình mail riêng nếu có (không bắt buộc, tự động ghi đè nếu tồn tại)
spring.config.import=optional:classpath:application-mail.properties,optional:file:application-mail.properties

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/talentmatch_pro?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.locale=vi_VN
spring.web.locale-resolver=fixed

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.messages.encoding=UTF-8

# Email thật qua SMTP. Với Gmail: dùng App Password, không dùng mật khẩu Gmail thường.
# Có thể ghi đè toàn bộ bằng Environment Variables khi chạy IntelliJ/Eclipse.
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.base-url=${APP_BASE_URL:http://localhost:5173}
# Cấu hình mail (ưu tiên application-mail.properties, có thể ghi đè bằng env MAIL_USERNAME / MAIL_PASSWORD)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Seed dữ liệu marketplace để trang tìm dự án có nhiều dữ liệu demo.
app.demo.seed=${APP_DEMO_SEED:true}
